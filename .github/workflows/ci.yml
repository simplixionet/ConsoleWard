name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only by default. Nothing here needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tests, typecheck, build, gates
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      # 24, not 22. The test harness imports `src/**/*.ts` directly and relies
      # on node stripping the types with no build step and no flag, which is
      # only the default from 22.18 — so `node-version: 22` silently depended on
      # which 22.x the runner happened to resolve. 24 is what the suite is
      # actually validated against; see `engines` in package.json.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # ci, not install — the lockfile is the contract, and a security tool
      # should not silently float a transitive dependency in CI.
      - name: Install
        run: npm ci

      # First, because it is the gate that catches the most. Every security
      # property in this repo — the vault's authenticated header, the KDF
      # validation, the approval cap, the exec channel's isolation from the
      # human's shell — is asserted here and nowhere else. CI ran typecheck,
      # build and the locale gates and never once ran these.
      - name: Tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Static locale gates: the shipping set, plural-aware key parity, and
      # placeholder integrity across the 81 security-critical keys.
      - name: Locale dictionaries
        run: npm run check:i18n

      # GPL requires the licence texts of everything shipped alongside the
      # binary to travel with it. NOTICE is generated, so a dependency added
      # without regenerating it makes the file a specific, checkable and wrong
      # claim about what is inside — which is worse than not having one.
      - name: Third-party notices are current
        run: npm run check:notice

      # check:i18n-ui is deliberately NOT run here. It drives the built app
      # over the Chrome DevTools Protocol and needs a real desktop session;
      # on a headless runner it would either hang or pass vacuously, and a
      # gate that cannot fail is worse than no gate. Run it locally before
      # tagging a release.

      - name: Icon is present and parses as an ICO
        shell: bash
        run: |
          node -e "
            const fs = require('fs')
            const b = fs.readFileSync('build/icon.ico')
            if (b.readUInt16LE(0) !== 0 || b.readUInt16LE(2) !== 1) throw new Error('not an ICO')
            const n = b.readUInt16LE(4)
            if (n < 1) throw new Error('ICO has no frames')
            let end = 0
            for (let i = 0; i < n; i++) {
              const at = 6 + i * 16
              const len = b.readUInt32LE(at + 8)
              const off = b.readUInt32LE(at + 12)
              const png = b.subarray(off, off + 4)
              if (png[0] !== 0x89 || png[1] !== 0x50) throw new Error('frame ' + i + ' is not a PNG')
              end = Math.max(end, off + len)
            }
            if (end !== b.length) throw new Error('frame offsets do not reach end of file')
            console.log('icon.ico ok: ' + n + ' frames, ' + b.length + ' bytes')
          "

      - name: Every source file carries an SPDX header
        shell: bash
        run: |
          # The root config files are named by glob instead of scanning `.`
          # recursively — from the root grep would walk node_modules, out and
          # release, and spend minutes concluding nothing.
          shopt -s nullglob
          status=0
          missing=$(grep -rL "SPDX-License-Identifier" \
            --include="*.ts" --include="*.tsx" --include="*.mts" --include="*.mjs" \
            src scripts test ./*.ts ./*.tsx ./*.mts ./*.mjs) || status=$?
          # With -L grep still reports 1 for "nothing matched anywhere" and 2
          # for "could not read a path". The old `|| true` flattened both into
          # a pass, so a renamed directory would have silenced the whole gate
          # rather than failing it.
          if [ "$status" -gt 1 ]; then
            echo "SPDX scan could not run (grep exited $status)."
            exit 1
          fi
          if [ -n "$missing" ]; then
            echo "Missing SPDX header:"
            echo "$missing"
            exit 1
          fi
          echo "All source files carry an SPDX header."
