name: Release

# Tag-driven. Pushing v1.0.0 builds the Windows installer and drafts a release
# from it. Nothing publishes on a branch push.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # 24, matching ci.yml and `engines` in package.json. On 22 the test
      # harness depends on which 22.x the runner resolves; the reasoning is
      # written out in full in ci.yml.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # The gates CI runs, in CI's order. A tag must not produce an installer
      # that would have failed a pull request — and this is the last chance to
      # notice, because what leaves here is what people download.
      #
      # CI's separate `npm run build` is absent on purpose: `npm run dist`
      # below starts with exactly that build, so running it twice would only
      # slow the tag down. check:i18n-ui is absent for the same reason it is
      # absent from CI — it needs a real desktop session. Run it locally
      # before tagging.
      - name: Tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Locale dictionaries
        run: npm run check:i18n

      # NOTICE is listed in build.files, so it is copied inside the installer
      # verbatim. A stale one ships a precise, checkable and wrong claim about
      # what the user just installed — and unlike in CI, nobody can amend it
      # afterwards without cutting a new tag.
      #
      # Regenerated here, NOT checked, and the difference is the whole point.
      # `cpu-features`, `buildcheck` and `nan` are optional native dependencies:
      # they install only where a compiler is present, so the committed NOTICE
      # deliberately omits them — it has to be reproducible on a laptop — while
      # this runner legitimately ships them.
      #
      # `--dist` is what makes that split explicit: it is the only form that
      # reads the installed tree, and this is the only place it runs. Without it
      # the installer would go out carrying native code whose licence terms were
      # not reproduced beside it, which is the obligation this file exists for.
      # Generating is still a gate: the script exits non-zero when an INSTALLED
      # package's terms cannot be reproduced.
      #
      # Before the build below, so what ships is what this machine installed.
      - name: Third-party notices for what this machine ships
        run: npm run notice:dist

      - name: Icon is present and parses as an ICO
        shell: bash
        run: |
          node -e "
            const fs = require('fs')
            const b = fs.readFileSync('build/icon.ico')
            if (b.readUInt16LE(0) !== 0 || b.readUInt16LE(2) !== 1) throw new Error('not an ICO')
            const n = b.readUInt16LE(4)
            if (n < 1) throw new Error('ICO has no frames')
            let end = 0
            for (let i = 0; i < n; i++) {
              const at = 6 + i * 16
              const len = b.readUInt32LE(at + 8)
              const off = b.readUInt32LE(at + 12)
              const png = b.subarray(off, off + 4)
              if (png[0] !== 0x89 || png[1] !== 0x50) throw new Error('frame ' + i + ' is not a PNG')
              end = Math.max(end, off + len)
            }
            if (end !== b.length) throw new Error('frame offsets do not reach end of file')
            console.log('icon.ico ok: ' + n + ' frames, ' + b.length + ' bytes')
          "

      # The tag must match the version in package.json, or the release will
      # claim to be something the installer is not.
      - name: Tag matches package.json version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME implies version $tag, package.json says $pkg."
            exit 1
          fi
          echo "Version $pkg confirmed."

      # electron-builder publishes nothing on its own here — the release step
      # below is the only thing that can, and it drafts rather than publishes.
      - name: Build installer
        run: npm run dist
        env:
          GH_TOKEN: ''

      - name: Collect artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: consoleward-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Draft release
    needs: windows
    runs-on: ubuntu-latest

    # The only job that writes. Scoped here rather than at workflow level so
    # the build job cannot touch the repository. id-token and attestations are
    # what attest-build-provenance needs to mint and store the attestation;
    # they stay in this job for the same reason contents: write does.
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: consoleward-windows
          path: dist

      # The notes tell people to verify a checksum, so something has to publish
      # one. Computed from inside dist so the file records bare names: whoever
      # downloads the assets into one folder can run `sha256sum -c` against it
      # unchanged. Written outside dist first so it never hashes itself.
      - name: Checksums
        run: (cd dist && sha256sum -- *) > SHA256SUMS.txt

      # The digests go in the body as well as in the file. An attacker who can
      # swap an asset can swap the checksums file next to it just as easily,
      # so the copy that matters is the one a human can read on the page.
      #
      # Both heredocs are quoted so the backticks and `$` in the examples reach
      # the file verbatim; @VERSION@ is filled in afterwards, from the tag the
      # build job already proved equal to package.json. The repository is named
      # by expression rather than spelled out, because ${{ }} is substituted
      # before the shell ever sees the script — and because a release cut from
      # a different repository must not tell people to verify against this one.
      - name: Release notes
        run: |
          cat > NOTES.md <<'HEAD'
          See [CHANGELOG.md](CHANGELOG.md) for what changed.

          **Windows only.** macOS and Linux targets are configured but have
          not been built or tested.

          The installer is unsigned — Windows SmartScreen will warn on first
          run. Verify it before trusting it.

          ### SHA-256

          ```
          HEAD
          cat SHA256SUMS.txt >> NOTES.md
          cat >> NOTES.md <<'TAIL'
          ```

          Put the downloads in one folder and check them:

          ```
          sha256sum -c SHA256SUMS.txt
          ```

          or, in PowerShell (the hash comes back uppercase — compare
          case-insensitively):

          ```
          Get-FileHash .\ConsoleWard-Setup-@VERSION@.exe -Algorithm SHA256
          ```
          TAIL
          sed -i "s/@VERSION@/${GITHUB_REF_NAME#v}/g" NOTES.md

      # Binds these exact bytes to this workflow, this repository and this tag,
      # which is the closest thing to a signature an unsigned installer gets.
      # Before the draft step: if provenance cannot be recorded, nothing should
      # reach the release page.
      #
      # Skipped while the repository is private, because GitHub does not offer
      # the feature there on this plan — the API answers "upgrade the billing
      # plan, or make this repository public". That is a fact about the account,
      # not a fault in the build, and failing the release over it would leave no
      # way to cut one at all. A private repository has no public artifact for
      # anyone to verify, so nothing is lost until it goes public; the step then
      # starts working on its own, with no edit here.
      - name: Build provenance
        id: provenance
        if: ${{ github.event.repository.private == false }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: dist/*

      # The paragraph is appended only when the attestation above actually ran.
      # Telling people to run `gh attestation verify` against a release that
      # carries no attestation is the same failure as the checksum instruction
      # that shipped with nothing to check.
      - name: Note the provenance
        if: ${{ steps.provenance.outcome == 'success' }}
        run: |
          cat >> NOTES.md <<'TAIL'

          ### Provenance

          Every asset above is attested to the workflow run that built it. With
          the GitHub CLI:

          ```
          gh attestation verify .\ConsoleWard-Setup-@VERSION@.exe --repo @REPO@
          ```
          TAIL
          sed -i "s/@VERSION@/${GITHUB_REF_NAME#v}/g;s|@REPO@|${{ github.repository }}|g" NOTES.md

      # Draft, not published. A human reads the notes, checks the installer and
      # presses the button — the same principle the product itself is built on.
      - name: Draft
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/*
            SHA256SUMS.txt
          body_path: NOTES.md
