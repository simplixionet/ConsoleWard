# Blank issues stay off. Not to make reporting harder, but because the two
# templates ask for the things that decide whether a report is actionable, and a
# blank box gets "it doesn't work" from people who would happily have filled a
# form in.
blank_issues_enabled: false

contact_links:
  - name: Security vulnerability
    url: https://github.com/simplixionet/ConsoleWard/security/advisories/new
    about: >
      Do NOT open a public issue. This project holds SSH private keys and drives
      a gate an AI model talks to; a public report is a live exploit until it is
      fixed. Use a private advisory, or email security@simplixio.net.
